name: Field report check

# Checks issues that carry a field report (docs/field-reports.md) and labels them.
# The issue body is untrusted: it reaches the script only through env, never through ${{ }} in run.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

concurrency:
  group: field-report-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check field report
    if: startsWith(github.event.issue.title, 'Field report:') || contains(github.event.issue.labels.*.name, 'field-report')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate the report and label the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_BODY: ${{ github.event.issue.body }}
          ISSUE: ${{ github.event.issue.number }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -u
          marker='<!-- field-report-check -->'
          if node scripts/check-report.mjs > result.md; then ok=1; else ok=0; fi
          # Labels are made once if missing; an existing label is left as it is.
          gh label create field-report --color 1d76db --description "A field report (docs/field-reports.md)" 2>/dev/null || true
          gh label create valid --color 0e8a16 --description "Field report passed the check" 2>/dev/null || true
          gh label create needs-fix --color d93f0b --description "Field report failed the check; see the comment" 2>/dev/null || true
          has() { case ",$LABELS," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          # One check comment per issue, updated on each edit.
          comment_id=$(gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | head -n 1)
          if [ "$ok" = 1 ]; then
            gh issue edit "$ISSUE" --add-label field-report --add-label valid
            if has needs-fix; then gh issue edit "$ISSUE" --remove-label needs-fix; fi
            printf '%s\n%s\n' "$marker" "The field report now passes the check. Thank you." > comment.md
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@comment.md > /dev/null
            fi
          else
            gh issue edit "$ISSUE" --add-label field-report --add-label needs-fix
            if has valid; then gh issue edit "$ISSUE" --remove-label valid; fi
            {
              echo "$marker"
              cat result.md
              echo
              echo "Edit the issue body to fix these (keep the same report_id); the check runs again on each edit."
              echo "Format: docs/field-reports.md."
            } > comment.md
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@comment.md > /dev/null
            else
              gh issue comment "$ISSUE" --body-file comment.md
            fi
          fi
          cat result.md
