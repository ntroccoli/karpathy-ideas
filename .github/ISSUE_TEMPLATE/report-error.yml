name: Report an error
description: A wrong date, broken link, misattribution or a summary that misreads the source.
labels: [correction]
body:
  - type: input
    id: file
    attributes:
      label: Idea file
      description: Path or link, for example ideas/2026-01-26-success-criteria-not-steps.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the line and explain the problem. Link the source that shows it.
    validations:
      required: true
